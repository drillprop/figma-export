  Three takes on the content model: ?variant=A|B|C or the bottom bar / arrow keys.
  "⚠ warnings" button simulates the truncated / preview-skipped / linked-component-failed cases

      .warnbody .warn { margin: 0; border: 0; }
      .warnbody .warn + .warn { margin-top: 4px; }

      /* section titles + chips + stats (technical detail) */
      .section { margin-top: 16px; }
      .section-title {
        font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
        color: var(--figma-color-text-secondary); margin-bottom: 8px;
      }
      .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

      .stat-val { font-size: 16px; font-weight: 700; }

  <body>
    <div class="panel">
      <div class="inner">
        <!-- ghosted panel above, so the report reads in context -->
        <div class="ghosted">
          <div class="ghost-btn">Export “Button / Primary”</div>
        </div>
        <div class="divider"></div>
        <div id="report"></div>
      </div>
    </div>

    <div class="switcher">
      <button onclick="cycle(-1)">‹</button>
      <span class="vlabel" id="vlabel"></span>
      <button onclick="cycle(1)">›</button>
      <span class="sep"></span>
      <button class="wide" id="warnbtn" onclick="toggleWarn()">⚠ warnings</button>
      <button class="wide" onclick="toggleTheme()" id="themebtn">☾</button>
    </div>

    <script>
      // --- sample data, mirroring today's ExportSummary ---
      const S = {
        path: "~/Programming/my-repo/figma-export",
        output: "Folder of assets",
        wrote: { data: "component.json", preview: "preview.html", icons: 12, images: 3 },
        target: { name: "Button / Primary", type: "Component set" },
        totalNodes: 214,
        components: { total: 34, local: 30, remote: 4 },
        remoteMastersResolved: 3,
        textLayerCount: 22,
        nodeTypes: [["VECTOR", 88], ["FRAME", 40], ["INSTANCE", 30], ["TEXT", 22], ["COMPONENT", 4]],
        sets: [{ name: "Button", axes: { State: ["Default", "Hover", "Pressed", "Disabled"], Size: ["S", "M", "L"] } }],
        textSamples: ["Submit", "Cancel", "Learn more"],
      };
      const WARN = {
        remoteError: { name: "Icon / Star", why: "published from another file that isn’t enabled here — saved as a reference only" },
      };

      let showWarn = false;
      const VARIANTS = [["A", "Receipt + Details"], ["B", "Flat & calm"], ["C", "Minimal"]];
      function cur() {
        const v = new URLSearchParams(location.search).get("variant");
        return VARIANTS.some(([k]) => k === v) ? v : "A";
      }

      const esc = (s) => s;
      function successHead() {
        return `<div class="success"><span class="tick">✓</span> Export saved</div>
          <div class="dest"><span class="p">${S.path}</span><button class="btn sm" onclick="return false">Open folder</button></div>
          <div class="actions">
            <button class="btn ghost" onclick="return false">Open preview</button>
            <button class="btn ghost" onclick="return false">Export another</button>
          </div>`;
      }
      function plainWrote() {
        return `<div class="wrote-plain">Saved your <b>${S.target.name}</b> as a <b>folder of assets</b> — a preview you can open,
          plus <b>${S.wrote.icons} icons</b> and <b>${S.wrote.images} images</b> as separate files.</div>`;
      }
      function warnBanners() {
        if (!showWarn) return "";
        const items = [
          `<b>Very large selection.</b> We saved the first 5,000 layers — export a smaller frame to include everything.`,
          `<b>Preview image skipped</b> — this artwork was too complex for an SVG preview. Everything else was saved; try the <b>Image (PNG)</b> preview next time.`,
          `<b>1 linked component couldn’t be loaded</b> — “${WARN.remoteError.name}” was ${WARN.remoteError.why}.`,
        ];
        // expandable: calm summary line by default, plain-language detail on expand
        return `<details class="warnbox">
          <summary>⚠ ${items.length} things worth knowing<span class="caret">▸</span></summary>
          <div class="warnbody">${items.map((i) => `<div class="warn">${i}</div>`).join("")}</div>
        </details>`;
      }
      // technical detail block (shared by A's disclosure + B's flat body)
      function techDetail() {
        const tiles = `<div class="stats">
          <div class="stat"><div class="stat-val">${S.totalNodes}</div><div class="stat-label">layers</div></div>
          <div class="stat"><div class="stat-val">${S.components.total}</div><div class="stat-label">components · ${S.components.local} local / ${S.components.remote} linked</div></div>
          <div class="stat"><div class="stat-val">${S.textLayerCount}</div><div class="stat-label">text layers</div></div>
          <div class="stat"><div class="stat-val">svg</div><div class="stat-label">preview</div></div>
        </div>`;
        const types = `<div class="section"><div class="section-title">Layer types</div><div class="chips">${
          S.nodeTypes.map(([t, n]) => `<span class="chip">${t}<span class="n">${n}</span></span>`).join("")
        }</div></div>`;
        const sets = `<div class="section"><div class="section-title">Variant sets (${S.sets.length})</div>${
          S.sets.map((set) => `<div style="font-weight:600;margin-bottom:4px">${set.name}</div>${
            Object.entries(set.axes).map(([k, vs]) => `<div class="axis"><div class="axis-key">${k}</div><div class="chips">${
              vs.map((v) => `<span class="chip">${v}</span>`).join("")
            }</div></div>`).join("")
          }`).join("")
        }</div>`;
        const remote = `<div class="section"><div class="section-title">Linked components</div>
          <div class="chips"><span class="badge ok">${S.remoteMastersResolved} loaded</span>${
            showWarn ? `<span class="badge warn">1 failed</span>` : ""
          }</div>${
            showWarn ? `<div style="margin-top:6px"><div style="font-weight:600">${WARN.remoteError.name}</div><div class="muted">${WARN.remoteError.why}</div></div>` : ""
          }</div>`;
        const text = `<div class="section"><div class="section-title">Text content</div><div class="samples">${
          S.textSamples.map((t) => `<div class="sample">“${t}”</div>`).join("")
        }<div class="sample muted">+${S.textLayerCount - S.textSamples.length} more…</div></div></div>`;
        return tiles + types + sets + remote + text;
      }

      function render() {
        const v = cur();
        let html = successHead() + warnBanners() + plainWrote();
        if (v === "A") {
          html += `<details class="more"><summary><span class="caret">▸</span> Details</summary><div style="margin-top:12px">${techDetail()}</div></details>`;
        } else if (v === "B") {
          html += `<div style="margin-top:4px">${techDetail()}</div>`;
        } else if (v === "C") {
          html += `<div style="margin-top:14px"><span class="link" onclick="return false">View export details</span></div>`;
        }
        document.getElementById("report").innerHTML = html;
        document.getElementById("vlabel").textContent = `${v} — ${VARIANTS.find(([k]) => k === v)[1]}`;
        document.getElementById("warnbtn").classList.toggle("armed", showWarn);
      }
      function cycle(d) {
        const keys = VARIANTS.map(([k]) => k);
        const i = keys.indexOf(cur());
        const next = keys[(i + d + keys.length) % keys.length];
        const u = new URL(location); u.searchParams.set("variant", next); history.replaceState(null, "", u);
        render();
      }
      function toggleWarn() { showWarn = !showWarn; render(); }
      function toggleTheme() {
        document.body.classList.toggle("dark");
        document.getElementById("themebtn").textContent = document.body.classList.contains("dark") ? "☀" : "☾";
      }
      document.addEventListener("keydown", (e) => {
        const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
      });
      render();
    </script>
  </body>
</html>
